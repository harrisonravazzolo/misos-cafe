name: "Apply latest configuration to Fleet"
on:
  push:
    branches:
      - main
    paths:
      - "**"
  pull_request:
    paths:
      - "**"
  workflow_dispatch: # allows manual triggering
  schedule:
    - cron: "0 6 * * *" # Nightly 6AM UTC
# Prevent concurrent runs of this workflow.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
# Limit permissions of GITHUB_TOKEN.
permissions:
  contents: read
  id-token: write # required for AWS OIDC
jobs:
  fleet-gitops:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

        
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::273354660820:role/github-actions-fleet
          aws-region: us-east-1
      - name: Presign bootstrap package URL
        run: |
          URL=$(aws s3 presign \
            s3://misos-cafe-bootstrap-package/misos-cafe-bootstrap.pkg \
            --expires-in 3600)
          echo "::add-mask::$URL"
          echo "BOOTSTRAP_URL=$URL" >> "$GITHUB_ENV"
      - name: Make github action script executable
        run: chmod +x ./.github/fleet-gitops/gitops.sh
      - name: Apply latest configuration to Fleet
        uses: ./.github/fleet-gitops
        with:
          # Run GitOps in dry-run mode for pull requests.
          dry-run-only: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
        env:
          FLEET_URL: ${{ secrets.FLEET_URL && secrets.FLEET_URL || 'https://fleet.example.com' }}
          FLEET_API_TOKEN: ${{ secrets.FLEET_API_TOKEN }}
          BOOTSTRAP_URL: ${{ env.BOOTSTRAP_URL }}
